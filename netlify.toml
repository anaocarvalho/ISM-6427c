# Plateful: static frontend in /public + one serverless function in /netlify/functions.
# Netlify installs dependencies from package.json automatically, then bundles the function.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/*.{css,js}"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
